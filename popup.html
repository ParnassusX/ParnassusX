<!DOCTYPE html>
<html>
<head>
  <title>Window Layout Manager - Quick Save</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Quick Save Preset</h1>

  <div id="status-message" class="status"></div>

  <div class="section" id="capture-layout-section">
    <button id="capture-layout-btn" class="secondary">Capture Current Window Layout</button>
    <div class="input-group">
      <input type="text" id="preset-name-input" placeholder="Enter new preset name..." />
      <button id="save-layout-btn">Save New Preset</button>
    </div>

    <div class="advanced-action-container">
      <button id="add-action-btn" class="secondary small">Add Action (Advanced)</button>
      <div id="action-details-panel" class="hidden">
        <label for="action-tab-select">Select a tab to run script on:</label>
        <select id="action-tab-select"></select>
        <label for="action-script-input">JavaScript to execute:</label>
        <textarea id="action-script-input" rows="4" placeholder="Example: alert('Page Loaded!');"></textarea>
        <button id="clear-action-btn" class="secondary small danger">Clear Action</button>
      </div>
    </div>
  </div>

  <div class="section">
    <h2>Quick Apply</h2>
    <div id="quick-apply-buttons" class="button-group vertical">
      <!-- Quick apply buttons will be added here by JavaScript -->
    </div>
  </div>

  <!--
    Instructions or link to side panel can be added here if desired, for example:
    <p style="text-align: center; margin-top: 15px; font-size: 0.9em;">
      Manage your saved presets in the <a href="#" id="open-side-panel-link">Side Panel</a>.
    </p>
  -->

  <script src="popup.js"></script>
</body>
</html>
