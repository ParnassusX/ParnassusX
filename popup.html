<!DOCTYPE html>
<html>
<head>
  <title>Window Layout Manager - Quick Save</title>
  <link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
  <h1>Quick Save Preset</h1>

  <div id="status-message" class="status"></div>

  <div class="section" id="capture-layout-section">
    <div class="workspace-manager">
      <select id="workspace-select"></select>
    </div>
    <button id="capture-layout-btn" class="secondary">Capture Current Window Layout</button>
    <div class="input-group" style="margin-top: 15px;">
      <input type="text" id="preset-name-input" placeholder="Enter new preset name..." />
      <button id="save-layout-btn">Save New Preset</button>
    </div>
  </div>

  <div class="section">
    <h2>Quick Apply</h2>
    <div id="quick-apply-buttons" class="button-group vertical">
      <!-- Quick apply buttons will be added here by JavaScript -->
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
